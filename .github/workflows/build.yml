# Baseline build/test gate: the project must compile and its tests must pass.
name: build

on:
  push:
    branches: [main, secure]
  pull_request:
    branches: [main, secure]

permissions:
  contents: read

jobs:
  build:
    name: mvn clean verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2/repository keyed on pom.xml

      - name: Build and test
        run: mvn -B clean verify
