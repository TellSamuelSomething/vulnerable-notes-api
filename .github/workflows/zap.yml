# DAST (Dynamic Application Security Testing): OWASP ZAP attacks the RUNNING app from the outside,
# the way a real attacker would, instead of reading the code (CodeQL) or the dependencies (Dependency-Check).
# The app only runs inside this job, on localhost; nothing is deployed anywhere.
# On `main` alerts are EXPECTED (intentionally vulnerable). The HTML report is saved as a build artifact.
name: zap

on:
  push:
    branches: [main, secure]
  pull_request:
    branches: [main, secure]

permissions:
  contents: read

jobs:
  dast:
    name: OWASP ZAP full scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      # `secure` needs a JWT signing secret; a fresh random one per run (ignored on `main`).
      - name: Start the app
        run: |
          JWT_SECRET="$(openssl rand -hex 32)" nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "::error::App did not start"; cat app.log; exit 1

      # Spider + active attacks (SQL injection, XSS, ...). fail_action: false = report, don't block.
      - uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://localhost:8080/
          fail_action: false
          allow_issue_writing: false # keep findings in the artifact instead of opening GitHub issues
          artifact_name: zap-report
