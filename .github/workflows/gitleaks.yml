# Secret scanning: Gitleaks searches the whole Git history for committed secrets (keys, tokens, passwords).
# On `main` it is EXPECTED to fail: the JWT signing secret is hard-coded there (vulnerability #4).
# On `secure`, .gitleaks.toml allowlists that one secret, which is public and no longer used (see docs/writeups/04-weak-jwt.md).
name: gitleaks

on:
  push:
    branches: [main, secure]
  pull_request:
    branches: [main, secure]

permissions:
  contents: read
  security-events: write # needed to upload SARIF to the Security tab

jobs:
  scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted from the code is still in old commits

      # The official binary, verified against the release's published checksums before it runs.
      - name: Install Gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive" checksums.txt

      # --redact keeps the secret values out of the public log and report.
      - name: Scan Git history
        run: ./gitleaks git . --redact --verbose --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
