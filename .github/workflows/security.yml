# Security scanning for an INTENTIONALLY VULNERABLE training project.
# Expected result: findings on the vulnerable branch, clean (or close to it) on the `secure` branch.
# Findings are reported to the repository's Security tab; the workflow does not fail on them.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so newly published CVEs show up without a code change
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-check:
    name: OWASP Dependency-Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Caches the downloaded NVD database between runs; the first run is slow.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      # Needs repository secret NVD_API_KEY (free: https://nvd.nist.gov/developers/request-an-api-key).
      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$NVD_API_KEY"
          -Dformats=HTML,SARIF
          -DossindexAnalyzerEnabled=false

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
