# SAST: GitHub CodeQL scans the source code for flaws such as SQL injection and XSS.
# Findings appear under Security -> Code scanning. On `main` they are EXPECTED (intentionally vulnerable).
name: codeql

on:
  push:
    branches: [main, secure]
  pull_request:
    branches: [main, secure]
  schedule:
    - cron: "0 6 * * 1" # weekly (Monday 06:00 UTC), picks up new CodeQL queries without a code change

permissions:
  contents: read
  actions: read
  security-events: write # needed to upload results to the Security tab

jobs:
  analyze:
    name: CodeQL (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java # alias for java-kotlin
          build-mode: manual
          queries: security-extended # wider rule set than the default

      - name: Compile
        run: mvn -B -DskipTests compile

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:java"
