# `secure` branch of a security-training project. Run locally only.
spring.application.name=vulnerable-notes-api

spring.datasource.url=jdbc:h2:mem:vulnnotes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# FIXED (A05:2021 Security Misconfiguration): no web-based database console.
spring.h2.console.enabled=false

# Session cookie for the notes page: not readable by JavaScript, not sent on cross-site POSTs.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m
# Never put the session id in URLs (;jsessionid=...), where it leaks via logs, history and Referer.
server.servlet.session.tracking-modes=cookie

spring.thymeleaf.cache=false

# FIXED (A02/A07): secret injected from the environment; no default, so startup fails if it is missing.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=PT15M
