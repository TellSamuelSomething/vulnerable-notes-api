<!DOCTYPE html>
<!-- WARNING: INTENTIONALLY VULNERABLE SECURITY-TRAINING PROJECT. DO NOT DEPLOY. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vulnerable Notes</title>
    <style>
        body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; }
        .warn { background: #b00020; color: #fff; padding: .75rem 1rem; border-radius: 4px; }
        .note { border: 1px solid #ccc; border-radius: 4px; padding: .5rem 1rem; margin: .5rem 0; }
        .meta { color: #666; font-size: .8rem; }
        input, textarea { width: 100%; box-sizing: border-box; margin-bottom: .5rem; }
    </style>
</head>
<body>
<div class="warn">
    <strong>Intentionally vulnerable training app.</strong> Do not deploy. Do not enter real data.
</div>

<h1>Notes</h1>

<div class="note" th:each="note : ${notes}">
    <!-- VULN (A03:2021 Injection - Stored XSS): th:utext renders user-controlled HTML/JS unescaped -->
    <h3 th:utext="${note.title}">title</h3>
    <div th:utext="${note.content}">content</div>
    <div class="meta">id <span th:text="${note.id}"></span>, owner <span th:text="${note.ownerId}"></span></div>
</div>

<h2>Add note</h2>
<form method="post" action="/notes">
    <input name="title" placeholder="Title" required>
    <textarea name="content" rows="4" placeholder="Content" required></textarea>
    <input type="hidden" name="ownerId" value="1">
    <button type="submit">Save</button>
</form>
</body>
</html>
