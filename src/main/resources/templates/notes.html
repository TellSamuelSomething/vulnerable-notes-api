<!DOCTYPE html>
<!-- `secure` branch: fixed version of the training app. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes (secure branch)</title>
    <!-- Styles live in a separate file so the CSP can forbid all inline code. -->
    <link rel="stylesheet" href="/notes.css">
</head>
<body>
<div class="warn">
    <strong>Security-training project (fixed <code>secure</code> branch).</strong> Do not enter real data.
</div>

<h1>Notes</h1>

<div class="note" th:each="note : ${notes}">
    <!-- FIXED (A03:2021 Injection - XSS): th:text HTML-escapes the value, so markup is shown as text -->
    <h3 th:text="${note.title}">title</h3>
    <div th:text="${note.content}">content</div>
    <div class="meta">id <span th:text="${note.id}"></span>, owner <span th:text="${note.ownerId}"></span></div>
</div>

<h2>Add note</h2>
<form method="post" action="/notes">
    <input name="title" placeholder="Title" required>
    <textarea name="content" rows="4" placeholder="Content" required></textarea>
    <input type="hidden" name="ownerId" value="1">
    <button type="submit">Save</button>
</form>
</body>
</html>
